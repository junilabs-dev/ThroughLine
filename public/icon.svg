<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with slight rounded corners for standalone icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.18" filter="url(#softGlow)" />

  <!-- Central Symbol: Intersecting Thought Nodes & Spark of Clarity -->
  <g transform="translate(256, 256)">
    <!-- Central Star Spark -->
    <path d="M 0 -85 C 5 -20 20 -5 85 0 C 20 5 5 20 0 85 C -5 20 -20 5 -85 0 C -20 -5 -5 -20 0 -85 Z"
          fill="url(#glowGrad)" />

    <!-- Orbital Connecting Nodes -->
    <circle cx="-90" cy="-90" r="14" fill="#818cf8" opacity="0.85" />
    <circle cx="90" cy="-90" r="14" fill="#2dd4bf" opacity="0.85" />
    <circle cx="-90" cy="90" r="14" fill="#2dd4bf" opacity="0.85" />
    <circle cx="90" cy="90" r="14" fill="#818cf8" opacity="0.85" />

    <!-- Delicate Connecting Filament Lines -->
    <line x1="-90" y1="-90" x2="-25" y2="-25" stroke="#6366f1" stroke-width="3" opacity="0.4" stroke-dasharray="4,4" />
    <line x1="90" y1="-90" x2="25" y2="-25" stroke="#14b8a6" stroke-width="3" opacity="0.4" stroke-dasharray="4,4" />
    <line x1="-90" y1="90" x2="-25" y2="25" stroke="#14b8a6" stroke-width="3" opacity="0.4" stroke-dasharray="4,4" />
    <line x1="90" y1="90" x2="25" y2="25" stroke="#6366f1" stroke-width="3" opacity="0.4" stroke-dasharray="4,4" />

    <!-- Core Center Dot -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>
</svg>
